appId: com.anomaly.proxy-mapper-desktop
productName: Proxy Mapper
copyright: Copyright (c) 2026 Anomaly

directories:
  output: dist
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# US-072: empaqueta los archivos del proxy (ESM entry + mapping.tsv + package.json
# con `"type": "module"` para que `utilityProcess.fork` lo detecte) en
# `resources/proxy/` dentro del .exe. El main los lee vía
# `process.resourcesPath/proxy/*` (NO `app.getAppPath()`; ver nota técnica).
# NO copiamos `node_modules` raíz porque el proxy sólo importa módulos
# nativos de Node (http, https, fs, path, url).
extraResources:
  - from: ../index.js
    to: proxy/index.js
  - from: ../mapping.tsv
    to: proxy/mapping.tsv
  - from: ../package.json
    to: proxy/package.json

# US-070: target NSIS para distribución estándar en Windows.
# US-071: target portable (segundo target junto a nsis; un solo .exe sin instalación).
# US-073: icono del .exe (Explorer) + manifest con requestedExecutionLevel:asInvoker
# (corre sin elevación UAC; consistente con perMachine:false del instalador).
win:
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

# US-070 AC3 (instalador sin admin): perMachine:false instala en %LOCALAPPDATA%.
# oneClick:false muestra el wizard (elige carpeta, accesos directos).
# allowToChangeInstallationDirectory:true deja al usuario mover el destino.
# US-074 AC2 (filenames deterministas): artifactName explícito sin timestamps.
nsis:
  artifactName: ${productName} Setup ${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# US-074 AC1+AC2: portable = segundo artefacto de la misma corrida;
# artifactName determinista (sin timestamp) para release reproducible.
portable:
  artifactName: ${productName}-${version}-portable.${ext}
